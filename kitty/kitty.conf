font_family      Iosevka Nerd Font
bold_font        Iosevka Nerd Font Bold
italic_font      Iosevka Nerd Font Italic
font_size        14.5

background_opacity      0.80
dynamic_background_opacity yes
hide_window_decorations yes
draw_minimal_borders    yes
window_border_width     1px
window_padding_width    12
window_margin_width     4

foreground              #E0E0E0
background              #0A0A0A
selection_foreground     #D61A1F
selection_background     #FFD700
cursor                  #FFD700
cursor_text_color       #0A0A0A
url_color               #F5C518

active_border_color     #FFD700
inactive_border_color   #D61A1F

active_tab_foreground   #0A0A0A
active_tab_background   #FFD700
inactive_tab_foreground #E0E0E0
inactive_tab_background #D61A1F

cursor_shape            underline
cursor_beam_thickness   2
cursor_blink_interval   0.5

# Tab Bar Settings
tab_bar_style           powerline
tab_powerline_style     angled
active_tab_font_style   bold
